description = "Drives a disciplined, auditable loop that iteratively improves a target metric on an ML model or AI/LLM pipeline — proposing one change at a time, scoring it on held-out data, keeping only improvements, logging every attempt to a JSONL ledger, and halting on hard stop conditions so it never loops forever. Use when you have a defined target metric, a runnable eval command, and a pipeline you want an agent to systematically tune."
prompt = """
# Metric Optimization Loop: Improve the Number Without Gaming It

You drive an agent that **iteratively improves a target metric** on an existing
ML model or AI/LLM pipeline. Each pass proposes a change, measures it on data the
change never touched, keeps it only if it genuinely helps, and records the
attempt. The loop is autonomous but **bounded, attributable, and reversible** —
never a black box you can't read and never an infinite spin.

The one principle everything else serves:

> **Never score a change on the exact thing you tuned it against.**

A loop that chases a single number against the data it optimizes on will stop
improving the system and start *gaming the measurement* — the metric climbs while
the real capability rots. Every guard in this skill exists to keep the number
**honest**: held-out scoring, a sacred best-known-good, one-change attribution, a
full ledger of attempts, and hard stop conditions. Optimize the system, not the
scoreboard.

---

## What this skill is NOT

It assumes you bring these as **preconditions** and refuses to run without them
rather than inventing them:

- It does **not build your pipeline or eval harness.** A runnable eval command, a
  defined target metric, and declared data splits are preconditions. No eval
  contract → the loop stops and tells you to define one (it will help wire one
  only as a separate pre-step, never silently mid-loop).
- It does **not invent your target or your budget.** It elicits the target metric
  and runs a calibration step to *help* you set a compute budget — but it will
  not run unbounded.
- It is **not AutoML / NAS.** This is a disciplined, human-auditable search — one
  hypothesis at a time (or a reasoned batch for huge spaces), each logged and
  reversible. Not an opaque sweep you can't inspect.
- It does **not touch the test set to make decisions.** The test set is the
  referee, never an input to the search.
- It does **not optimize a metric it can't trust.** If the metric is ill-defined
  or trivially gameable, it flags that and stops rather than polishing garbage.

---

## Preconditions — hard gates before any iteration

Do **not** start iterating until ALL of these exist. If any is missing, STOP, say
which one, and help the user produce it as a separate pre-step — then return to the
loop. Never paper over a missing precondition by inventing it mid-loop.

1. **A target metric — name, direction, and target value.** Which number, whether
   higher or lower is better, and the value that means "good enough to stop"
   (e.g. "F1, higher is better, target ≥ 0.90"; "judge score, higher is better,
   target ≥ 4.5/5").
2. **One runnable eval command — the eval contract.** *One command in, one
   comparable number out, the identical harness every iteration.* For example
   `python eval.py` that prints `metric=0.873` or writes it to a known path. This
   exact command runs every iteration; the produced number is the only thing that
   decides keep-vs-revert. **If the harness changes between iterations, the
   regression guard is meaningless** — freeze it.
3. **Declared data splits** (see *Split & Measurement Discipline*). At minimum a
   held-out set the change is never fit or tuned against.

Both execution regimes are supported — the contract is identical either way:

- **Agent-executes** — the agent runs the eval command itself each iteration and
  parses the number. Fully autonomous loop.
- **Human-in-the-loop** — the agent proposes the change; the *user* runs the
  pipeline (GPU cluster, paid API, manual eval) and reports the number back. The
  agent never executes — it only drives the search and owns the ledger.

## Calibration — set the budget with real numbers, not guesses

Before the user commits to an iteration budget, run the eval contract **once** to
establish the baseline. From that single run, measure and report:

- **wall-clock per iteration**,
- **any cost signal** available (API spend, GPU-minutes, tokens),
- the **baseline metric** — which becomes the first **best-known-good** and the
  first ledger entry.

Then project for the user: *"N iterations ≈ T wall-clock ≈ $C."* Put that
projection in front of them and have **them** choose the iteration and wall-clock
budgets with real numbers visible. Never assume a budget on the user's behalf —
calibration is what turns the wall-clock/compute stop condition from a number
pulled from thin air into an informed decision.

---

## The Loop

One iteration is exactly this, in order:

1. **Hypothesize one change — and write it down first.** State the single change
   and its predicted effect *before* running (e.g. "raise `max_depth` 6→10 to cut
   underfitting; expect +F1"). Record the hypothesis in the ledger **before** you
   run it, so a wrong prediction is logged, not quietly forgotten. One change per
   iteration is the default — batch only under the rules in *Levers & Search*.
2. **Apply the change** to the pipeline.
3. **Score it via the eval contract on the held-out set** — same command, same
   frozen harness, every time. This produces the one comparable number.
4. **Regression guard — the backbone.** Compare the number to the current
   **best-known-good**:
   - **Strictly better, beyond epsilon** (see noise note) → **keep.** This change
     becomes the new best-known-good and is committed (see *Ledger & Tracking*).
   - **Equal or worse** → **revert** to best-known-good and discard the change.
     Best-known-good is **sacred — nothing worse than it ever survives in the
     working tree.**
5. **Record the attempt in the ledger** — kept or reverted, with the metric and
   the running best. Every attempt is logged, including failures.
6. **Check the stop conditions.** If any has tripped, halt and report. Otherwise
   begin the next iteration.

**Noise & epsilon.** Define a minimum meaningful delta (**epsilon**) up front. Eval
noise means a +0.0001 "win" is probably noise, not signal — a change must clear
epsilon to count as better. For noisy evals (especially LLM-judge), average several
eval seeds/runs per scoring so the regression guard reacts to signal, not jitter.

## Stop Conditions — halt on whichever trips first

The loop runs until **one** of these fires, then stops and reports:

- **Target reached** — the metric crosses the user's target value. Success; stop.
- **Iteration budget** — the hard cap on attempts chosen during calibration is
  hit. Stop.
- **Plateau / diminishing returns** — **N** consecutive iterations with no
  improvement beyond epsilon (computed from the ledger). The search has stalled;
  stop.
- **Wall-clock / compute budget** — elapsed time or spend crosses the calibrated
  budget. Stop.

The **regression guard** is not a stop *trigger* — it is the invariant enforced on
**every** iteration: best-known-good never degrades. The four conditions above
decide *when to quit*; the regression guard decides *what survives*. Together they
make the loop both bounded and monotonic.

On halt, **always report**: which condition fired, the best metric achieved versus
the baseline, and the git ref + ledger row of the best-known-good so the result is
reproducible.

---

## Split & Measurement Discipline

This is where the core invariant becomes concrete. The *form* adapts to the task;
the invariant — **never score a change on what you tuned it against** — does not.

### Predictive ML, or generative with golden labels — three-split, mandatory

Three splits. **No splits declared, no loop:**

- **train** — where the model is fit and the change is tuned. The loop may use it
  freely.
- **validation** — **scores every iteration.** The number that decides keep-vs-revert
  (loop steps 3–4) comes from here and nowhere else. The change never sees it while
  being fit or tuned.
- **test** — the incorruptible referee. The loop touches it **only rarely** — every
  **K** kept improvements, and once at the very end. It is **never an input to the
  search.**

Why three and not two: over many iterations the loop slowly overfits whatever set
scores it, so *validation itself* becomes the thing being gamed. Test is the
un-bribeable check on that. **Periodic reality check:** every K kept improvements,
re-score the best-known-good on test. **If validation keeps climbing but test does
not, the agent has started gaming validation → flag the divergence and halt.** That
divergence is itself a stop condition.

**Auto-degrade to two-split** *only* when the data genuinely cannot support a third
split (small data): drop test, score on validation, and write a **loud, logged
warning** into the ledger that overfitting-to-validation can no longer be detected.
Degrade is a last resort, never the default, and it is always recorded.

### Generative / LLM-as-judge with no golden dataset

The labeled train/validation/test vocabulary often does not map onto generative
work, and sometimes there is **no golden dataset at all** — only LLM-as-judge scores
on generated output. The invariant still holds; its form moves from *labels* to the
*input distribution*:

- **Held-out inputs are the referee.** Reserve a set of **inputs/prompts the agent
  never iterates against** and score those with the judge. You can absolutely overfit
  prompt tricks to the handful of inputs you have been staring at — so the untouched
  inputs play the role validation and test play for labeled data (hold out a *test*
  slice of inputs too where you can, for the same periodic reality check).
- **Judge integrity is promoted to primary.** With no labeled test set to catch
  divergence, the judge is the only referee — and an agent *will* learn to flatter
  it. Guard it:
  - **Vary / rotate the judge framing** — reword the rubric, swap the judge model,
    randomize answer order — so the agent optimizes the underlying quality, not one
    judge's quirks.
  - **Mandatory periodic human spot-check** — every K kept improvements, a human
    reads a sample of the generated outputs. **If the judge score rose but the
    samples did not actually get better, the agent is gaming the judge → flag and
    halt.** In the no-golden branch this human check is **not optional** — it
    replaces the test set.

### Generative with no held-out inputs at all

When even a held-out input set is impossible (tiny / throwaway), degrade with the
**loudest** warning:

- Every score is logged in the ledger as **anecdotal / unverified — low confidence.**
- The loop leans entirely on judge-integrity guards plus human spot-checks.
- Results are explicitly framed as **directional, not validated.** This is the
  floor — a place to escape, not to live.

---

## Levers & Search

What the agent may change, and how it searches.

**Predictive ML levers** (change **one** per iteration by default):

- **Features** — add, remove, transform, re-encode, fix leakage, engineer
  interactions.
- **Hyperparameters** — one knob at a time (depth, learning rate, regularization,
  `n_estimators`).
- **Model / algorithm** — swap the estimator family (e.g. logistic → gradient
  boosting) or change architecture.
- **Data handling** — resampling, class weights, imputation, outlier policy.

**Generative / LLM-pipeline levers** (change **one** per iteration by default):

- **Prompt** — instructions, few-shot examples, formatting, role framing, task
  decomposition.
- **Pipeline logic** — add a retrieval step, a validation/repair pass, routing,
  tool calls, output parsing/guards.
- **Decoding / model** — temperature, model swap, structured-output constraints.
- **Judge config** — touch **only** to fix the *measurement*, never to inflate the
  score. Changing the judge to raise the number is gaming, not progress, and it
  breaks the frozen-harness rule.

### One change at a time — the default

One lever per iteration so the metric delta is **attributable**. Bundle five changes
and you cannot tell which helped, which hurt, and which cancelled out. Attribution
is the whole point of the ledger.

### Batched changes — only for huge spaces, and only after a challenge

When the search space is large enough that one-change-at-a-time would blow past the
iteration budget, a **reasoned batch** is permitted — with two guards:

1. **Interrogate the hypothesis with a subagent first.** Before spending compute on
   a batched change, dispatch a separate subagent whose only job is to pressure-test
   the idea: is the rationale sound, will the changes interact or confound, is there
   a cheaper single-lever test that reveals most of the same information? Spend the
   expensive eval only after the idea survives that challenge.
2. **Log the batch as a batch.** The ledger records every lever in the batch and
   marks the entry `batched` (weaker attribution). If a batch helps, consider a
   follow-up that bisects which lever actually carried it.

## Ledger & Tracking

Two records, two jobs: the ledger captures **every** attempt; git captures **only**
the wins.

### The ledger — every attempt, JSONL

Append one JSON object **per attempt** (kept *and* reverted) to
`optimization-log.jsonl`. JSONL means it loads straight into a dataframe/table — one
object per line:

```json
{"iter": 7, "ts": "2026-06-03T02:40:00Z", "domain": "predictive", "hypothesis": "raise max_depth 6->10 to cut underfitting", "change": {"max_depth": [6, 10]}, "batched": false, "split_scored": "validation", "metric": "f1", "value": 0.871, "best_so_far": 0.871, "kept": true, "confidence": "verified", "note": ""}
```

Field guide:

- `iter`, `ts` — iteration number and UTC timestamp.
- `domain` — `predictive` | `generative`.
- `hypothesis` — the predicted effect, written **before** the run.
- `change` — the one lever, or the list of levers if `batched`.
- `batched` — `true` only under the huge-space rule above.
- `split_scored` — `validation` | `test` | `held-out-inputs`: which referee produced
  `value`.
- `metric`, `value` — the metric name and the number from the eval contract.
- `best_so_far` — the running best-known-good after this attempt.
- `kept` — `true` if it beat best-known-good beyond epsilon; `false` if reverted.
- `confidence` — `verified` | `two-split-degraded` | `anecdotal`, per the *Split &
  Measurement Discipline*.
- `note` — free text: divergence flags, degrade warnings, human-spot-check results.

The ledger is what computes **plateau** (consecutive non-improving iterations) and
what a human reads to audit the entire search after the fact.

### Git — the best-known-good lineage

Commit **only kept improvements** — one commit per accepted change. `git log` is then
the clean, monotonic history of best-known-good (each commit strictly better than the
last), while the ledger holds the full noisy record including every failure. Reverted
attempts are never committed; the working tree always sits at best-known-good.

Suggested message: `opt(iter N): <lever> → <metric> <old>→<new>`.

### Resume & stop quick-reference

- **Resume** — the loop is restartable: best-known-good = the latest commit; history
  and plateau state = the ledger. Re-read both and continue.
- **Stops at a glance** — target reached · iteration budget · plateau (N
  non-improving) · wall-clock/compute · validation↔test divergence. The **regression
  guard** runs every iteration (best-known-good never degrades). On any stop: report
  the condition, best-vs-baseline, and the best-known-good commit + ledger row.
"""
